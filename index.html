<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Codeflow | AI Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060609;
      --surface: #0d0e14;
      --surface-2: #12141c;
      --border: #26283a;
      --border-bright: #3b3f5c;
      --cyan: #00f0ff;
      --magenta: #ff2ec4;
      --yellow: #f4e04d;
      --text: #d8f4ff;
      --text-muted: #7683a3;
      --text-faint: #454b64;
      --danger: #ff4d5e;
      --success: #35f2a2;
      --header-h: 52px;
      --topbar-h: 50px;
      --radius: 2px;
      font-family: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: inherit;
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
    }

    ::selection { background: var(--magenta); color: #05050a; }
    *:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    * { scrollbar-width: thin; scrollbar-color: var(--border-bright) transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { background: var(--border-bright); }
    *::-webkit-scrollbar-track { background: transparent; }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.025) 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: overlay;
    }

    svg.icon { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; display: block; }

    /* ===== Masthead ===== */
    .masthead {
      height: var(--header-h);
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
    }
    .masthead::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
      animation: sweep 4s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-40%); }
      100% { transform: translateX(40%); }
    }
    .glitch {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      position: relative;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }
    .glitch::before, .glitch::after {
      content: 'CODEFLOW';
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      overflow: hidden;
      background: var(--surface);
      clip-path: inset(0 0 0 0);
    }
    .glitch::before { color: var(--cyan); animation: glitch-a 3.5s infinite linear alternate-reverse; }
    .glitch::after { color: var(--magenta); animation: glitch-b 2.6s infinite linear alternate-reverse; }
    @keyframes glitch-a {
      0%, 92%, 100% { clip-path: inset(0 0 95% 0); transform: translate(0,0); }
      93% { clip-path: inset(10% 0 60% 0); transform: translate(-2px,0); }
      95% { clip-path: inset(60% 0 5% 0); transform: translate(2px,0); }
      97% { clip-path: inset(30% 0 40% 0); transform: translate(-1px,0); }
    }
    @keyframes glitch-b {
      0%, 90%, 100% { clip-path: inset(95% 0 0 0); transform: translate(0,0); }
      91% { clip-path: inset(20% 0 50% 0); transform: translate(2px,0); }
      94% { clip-path: inset(50% 0 15% 0); transform: translate(-2px,0); }
      98% { clip-path: inset(5% 0 70% 0); transform: translate(1px,0); }
    }

    .app-layout { display: flex; height: calc(100vh - var(--header-h)); height: calc(100dvh - var(--header-h)); width: 100vw; position: relative; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 290px;
      background: var(--surface);
      background-image:
        linear-gradient(var(--surface), var(--surface)),
        repeating-linear-gradient(0deg, rgba(0,240,255,0.035) 0px, transparent 1px, transparent 24px),
        repeating-linear-gradient(90deg, rgba(255,46,196,0.035) 0px, transparent 1px, transparent 24px);
      border-right: 1px solid var(--border-bright);
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      flex-shrink: 0;
      z-index: 50;
      transition: transform 0.2s ease;
      gap: 12px;
    }

    .sidebar-top { display: flex; align-items: stretch; gap: 8px; }
    #new-chat-btn { border-color: var(--border-bright); }
    #new-chat-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .close-btn { display: none; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; }
    .close-btn:hover { color: var(--cyan); }

    .panel-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 0.8rem;
      position: relative;
    }
    .panel-card::before, .panel-card::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border: 1px solid var(--cyan);
      opacity: 0.7;
    }
    .panel-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .panel-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    .panel-card h4 {
      font-weight: 400;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-card h4 .refresh-btn { cursor: pointer; color: var(--text-faint); display: flex; padding: 2px; transition: color 0.15s ease, transform 0.3s ease; }
    .panel-card h4 .refresh-btn:hover { color: var(--cyan); transform: rotate(80deg); }

    input, button { font-size: 0.83rem; border-radius: var(--radius); font-family: inherit; }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
      margin-bottom: 8px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input::placeholder { color: var(--text-faint); }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(0,240,255,0.15); }

    .btn-group { display: flex; gap: 8px; }
    .btn-primary, .btn-secondary {
      border: 1px solid transparent;
      padding: 7px 12px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-primary { background: var(--cyan); color: #04141a; box-shadow: 0 0 10px rgba(0,240,255,0.25); }
    .btn-primary:hover { background: #4bf6ff; box-shadow: 0 0 16px rgba(0,240,255,0.45); }
    .btn-secondary { background: transparent; border-color: var(--border-bright); color: var(--text); }
    .btn-secondary:hover { border-color: var(--magenta); color: var(--magenta); }
    .btn-full { width: 100%; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .file-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); border: 1px solid var(--border);
      padding: 6px 8px; margin-bottom: 10px; font-size: 0.74rem; color: var(--text-muted);
    }
    .file-row input[type="file"] { border: none; padding: 0; margin: 0; font-size: 0.74rem; color: var(--text-muted); width: 100%; }

    .history-list { flex: 1; overflow-y: auto; list-style: none; margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .history-item {
      border-left: 2px solid transparent;
      padding: 8px 8px 8px 10px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .history-item:hover { background: var(--surface-2); border-left-color: var(--magenta); }
    .history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 175px; color: var(--text); }
    .action-icons { display: flex; gap: 2px; flex-shrink: 0; color: var(--text-faint); }
    .icon-btn { cursor: pointer; padding: 4px; display: flex; }
    .icon-btn:hover { color: var(--cyan); }
    .icon-btn.del:hover { color: var(--danger); }
    .empty-hint { color: var(--text-faint); font-size: 0.76rem; padding: 10px 2px; }

    /* ===== Main ===== */
    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; position: relative; }

    .top-bar {
      height: var(--topbar-h);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
      gap: 12px;
    }
    .top-bar-title { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; letter-spacing: 0.05em; text-transform: uppercase; }
    .top-bar-title .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .menu-btn { display: none; align-items: center; justify-content: center; background: none; border: 1px solid var(--border-bright); color: var(--text); padding: 6px 9px; cursor: pointer; }
    .limit-control { display: flex; align-items: center; gap: 8px; font-size: 0.74rem; color: var(--text-muted); flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.05em; }
    .limit-control input { width: 54px; margin: 0; padding: 4px 6px; text-align: center; }

    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 26px clamp(14px, 5vw, 70px) 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      background-image: radial-gradient(circle at 15% 0%, rgba(255,46,196,0.06), transparent 40%),
                         radial-gradient(circle at 85% 100%, rgba(0,240,255,0.05), transparent 40%);
    }

    .msg-wrap { display: flex; width: 100%; }
    .msg-wrap.user { justify-content: flex-end; }
    .msg-wrap.agent { justify-content: flex-start; }

    /* Boxy answer design */
    .message {
      max-width: min(76%, 640px);
      padding: 12px 15px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      background: var(--surface);
    }
    .msg-wrap.user .message {
      border: 1px solid var(--magenta);
      box-shadow: 0 0 12px rgba(255,46,196,0.18), inset 0 0 20px rgba(255,46,196,0.04);
      color: var(--text);
    }
    .msg-wrap.agent .message {
      border: 1px solid var(--cyan);
      box-shadow: 0 0 12px rgba(0,240,255,0.16), inset 0 0 20px rgba(0,240,255,0.04);
    }
    .message::before {
      content: attr(data-tag);
      position: absolute;
      top: -9px; left: 10px;
      background: var(--bg);
      padding: 0 6px;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .msg-wrap.user .message::before { color: var(--magenta); }
    .msg-wrap.agent .message::before { color: var(--cyan); }

    .input-bar {
      padding: 14px clamp(14px, 5vw, 70px) 18px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      position: relative;
    }
    .input-bar input {
      margin-bottom: 0;
      border-radius: var(--radius);
      padding: 11px 16px;
      background: var(--surface);
      border: 1px solid var(--border-bright);
    }
    .send-btn { width: 44px; height: 44px; padding: 0; flex-shrink: 0; }

    /* ===== Cat mascot ===== */
    #cat-mascot {
      position: absolute;
      right: clamp(14px, 5vw, 70px);
      bottom: 100%;
      margin-bottom: 6px;
      width: 46px;
      height: 34px;
      color: var(--cyan);
      filter: drop-shadow(0 0 5px rgba(0,240,255,0.6));
      pointer-events: none;
      transform: translateY(0);
    }
    #cat-mascot.jump { animation: cat-jump 0.6s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cat-jump {
      0%   { transform: translateY(0) scaleY(1); }
      30%  { transform: translateY(-26px) scaleY(1.05); }
      55%  { transform: translateY(-26px) scaleY(1); }
      75%  { transform: translateY(2px) scaleY(0.9); }
      100% { transform: translateY(0) scaleY(1); }
    }

    .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; }

    @media (max-width: 1024px) {
      .sidebar { width: 250px; }
      .chat-window, .input-bar { padding-left: 18px; padding-right: 18px; }
    }

    @media (max-width: 768px) {
      .menu-btn { display: inline-flex; }
      .close-btn { display: inline-flex; }
      .sidebar {
        position: fixed; top: var(--header-h); bottom: 0; left: 0;
        width: min(84vw, 300px);
        transform: translateX(-100%);
        box-shadow: 12px 0 32px rgba(0,0,0,0.5);
        height: calc(100% - var(--header-h));
      }
      .sidebar.open { transform: translateX(0); }
      .backdrop.active { display: block; }
      .message { max-width: 88%; font-size: 0.86rem; }
      .chat-window { padding: 16px 16px 8px; }
      .input-bar { padding: 10px 12px 14px; }
      .top-bar { padding: 0 12px; }
      .top-bar-title span:last-child { display: none; }
      .glitch { font-size: 1.05rem; }
      #cat-mascot { right: 12px; }
    }

    @media (max-width: 420px) {
      .limit-control span { display: none; }
      .message { max-width: 92%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sidebar, .panel-card h4 .refresh-btn, .glitch::before, .glitch::after, .masthead::after, .top-bar-title .pulse { animation: none; }
      #cat-mascot.jump { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Masthead header, in front of the workspace top bar -->
  <div class="masthead">
    <div class="glitch">Codeflow</div>
  </div>

  <div class="app-layout">
    <div id="backdrop" class="backdrop" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <button id="new-chat-btn" class="btn-secondary" onclick="newChat()" style="flex:1;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
        <button class="close-btn" onclick="toggleSidebar()" aria-label="Close menu">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="panel-card">
        <h4>
          <span>Account</span>
          <span id="auth-status" style="color: var(--text-muted)">Guest</span>
        </h4>
        <div id="auth-form">
          <input type="email" id="email" placeholder="Email">
          <input type="password" id="password" placeholder="Password">
          <div class="btn-group">
            <button onclick="login()" class="btn-primary" style="flex:1">Log in</button>
            <button onclick="register()" class="btn-secondary" style="flex:1">Register</button>
          </div>
        </div>
        <button id="logout-btn" onclick="logout()" class="btn-secondary btn-full" style="display:none;">Log out</button>
      </div>

      <div class="panel-card">
        <h4>Workspace files</h4>
        <div class="file-row">
          <input type="file" id="upload-input">
        </div>
        <button onclick="uploadFile()" class="btn-secondary btn-full" style="margin-bottom:10px;">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
          Upload
        </button>
        <div style="display:flex; gap:6px;">
          <input type="text" id="dl-filename" placeholder="filename.py" style="margin-bottom:0;">
          <button onclick="downloadFile()" class="btn-primary" style="flex-shrink:0">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
          </button>
        </div>
      </div>

      <div class="panel-card" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <h4>
          <span>Saved chats</span>
          <span onclick="fetchHistory()" class="refresh-btn" title="Refresh">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v6h-6"/></svg>
          </span>
        </h4>
        <ul id="history-list" class="history-list">
          <li class="empty-hint">Log in to see saved chats</li>
        </ul>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Open menu">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="top-bar-title"><span class="pulse"></span><span>Workspace</span></div>
        <div class="limit-control">
          <span>Limit</span>
          <input type="number" id="chat-limit" value="100">
        </div>
      </header>

      <div id="chat-window" class="chat-window">
        <div class="msg-wrap agent">
          <div class="message" data-tag="agent">Welcome to CodeFlow. You can chat with the agent, upload files, and manage your history.</div>
        </div>
      </div>

      <footer class="input-bar">
        <!-- Cat mascot: jumps on send -->
        <svg id="cat-mascot" viewBox="0 0 64 46" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 40 C10 28 16 20 20 16 L16 6 L26 14 C29 13 35 13 38 14 L48 6 L44 16 C48 20 54 28 54 40 C54 43 50 44 46 44 L18 44 C14 44 10 43 10 40 Z"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="24" cy="27" r="1.6" fill="currentColor"/>
          <circle cx="40" cy="27" r="1.6" fill="currentColor"/>
          <path d="M29 32 L32 34 L35 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input type="text" id="prompt-input" placeholder="Type a message or instruction..." onkeydown="if(event.key==='Enter') sendChat()">
        <button id="send-btn" onclick="sendChat()" class="btn-primary send-btn" aria-label="Send">
          <svg class="icon" viewBox="0 0 24 24" style="width:17px;height:17px;"><path d="m5 12 14-7-7 14-2-5-5-2Z"/></svg>
        </button>
      </footer>
    </main>
  </div>

  <script>
    let token = localStorage.getItem("token") || "";

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("backdrop").classList.toggle("active");
    }

    function newChat() {
      const win = document.getElementById("chat-window");
      win.innerHTML = '<div class="msg-wrap agent"><div class="message" data-tag="agent">Welcome to CodeFlow. You can chat with the agent, upload files, and manage your history.</div></div>';
      const input = document.getElementById("prompt-input");
      input.value = "";
      input.focus();
      if (window.innerWidth <= 768 && document.getElementById("sidebar").classList.contains("open")) {
        toggleSidebar();
      }
    }

    function triggerCatJump() {
      const cat = document.getElementById("cat-mascot");
      if (!cat) return;
      cat.classList.remove("jump");
      void cat.offsetWidth; // restart animation
      cat.classList.add("jump");
    }

    function updateAuthUI() {
      const statusEl = document.getElementById("auth-status");
      const authForm = document.getElementById("auth-form");
      const logoutBtn = document.getElementById("logout-btn");

      if (token) {
        statusEl.textContent = "✓ Logged In";
        statusEl.style.color = "var(--success)";
        authForm.style.display = "none";
        logoutBtn.style.display = "block";
        fetchHistory();
      } else {
        statusEl.textContent = "Guest";
        statusEl.style.color = "var(--text-muted)";
        authForm.style.display = "block";
        logoutBtn.style.display = "none";
        document.getElementById("history-list").innerHTML = '<li class="empty-hint">Log in to see saved chats</li>';
      }
    }

    function logout() {
      token = "";
      localStorage.removeItem("token");
      updateAuthUI();
    }

    // POST /login
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.access_token;
        localStorage.setItem("token", token);
        updateAuthUI();
      } else {
        alert(data.detail || "Login failed");
      }
    }

    // POST /register
    async function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.access_token;
        localStorage.setItem("token", token);
        updateAuthUI();
      } else {
        alert(data.detail || "Registration failed");
      }
    }

    // GET /ask
    async function fetchHistory() {
      if (!token) return;
      const res = await fetch("/ask", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.ok) {
        const items = await res.json();
        const list = document.getElementById("history-list");
        list.innerHTML = "";
        if (!items.length) {
          list.innerHTML = '<li class="empty-hint">No saved chats yet</li>';
          return;
        }
        items.forEach(item => {
          const li = document.createElement("li");
          li.className = "history-item";
          li.innerHTML = `
            <span class="history-title">${escapeHtml(item.question)}</span>
            <div class="action-icons">
              <span class="icon-btn" title="Edit" onclick="editQuestion(event, ${item.id}, '${escapeQuotes(item.question)}')">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </span>
              <span class="icon-btn del" title="Delete" onclick="deleteHistory(event, ${item.id})">
                <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
              </span>
            </div>
          `;
          li.onclick = () => {
            renderExchange(item.question, item.answer);
            if (window.innerWidth <= 768) toggleSidebar();
          };
          list.appendChild(li);
        });
      }
    }

    // PUT /ask
    async function editQuestion(e, id, oldText) {
      e.stopPropagation();
      const updated = prompt("Update question text:", oldText);
      if (!updated || updated.trim() === oldText) return;

      const res = await fetch("/ask", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ id, question: updated.trim() })
      });
      if (res.ok) {
        fetchHistory();
      } else {
        const err = await res.json();
        alert(err.detail || "Update failed");
      }
    }

    // DELETE /ask
    async function deleteHistory(e, id) {
      e.stopPropagation();
      if (!confirm("Delete this saved question?")) return;
      const res = await fetch(`/ask?id=${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (res.ok) {
        fetchHistory();
      } else {
        const err = await res.json();
        alert(err.detail || "Delete failed");
      }
    }

    // POST /api/workspace/upload
    async function uploadFile() {
      const input = document.getElementById("upload-input");
      if (!input.files.length) return alert("Select a file to upload.");
      if (!token) return alert("Please login first.");

      const formData = new FormData();
      formData.append("file", input.files[0]);

      const res = await fetch("/api/workspace/upload", {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });
      const data = await res.json();
      if (res.ok) {
        alert(data.message);
        input.value = "";
      } else {
        alert(data.detail || "Upload failed");
      }
    }

    // GET /api/workspace/download
    async function downloadFile() {
      const filename = document.getElementById("dl-filename").value.trim();
      if (!filename) return alert("Enter a filename to download.");
      if (!token) return alert("Please login first.");

      const res = await fetch(`/api/workspace/download?filename=${encodeURIComponent(filename)}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (!res.ok) {
        const err = await res.json();
        return alert(err.detail || "File not found or access denied");
      }

      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    }

    // POST /chat
    async function sendChat() {
      const input = document.getElementById("prompt-input");
      const limit = parseInt(document.getElementById("chat-limit").value, 10) || 100;
      const question = input.value.trim();
      if (!question) return;

      triggerCatJump();

      if (!token) {
        alert("Please login first to chat.");
        return;
      }

      appendMessage(question, true);
      input.value = "";
      document.getElementById("send-btn").disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ question, limit })
        });
        const data = await res.json();
        if (res.ok) {
          appendMessage(data.answer, false);
          fetchHistory();
        } else {
          appendMessage(`Error: ${data.detail || "Request failed"}`, false);
        }
      } catch (err) {
        appendMessage(`Connection error: ${err.message}`, false);
      } finally {
        document.getElementById("send-btn").disabled = false;
      }
    }

    function appendMessage(text, isUser = false) {
      const win = document.getElementById("chat-window");
      const wrap = document.createElement("div");
      wrap.className = `msg-wrap ${isUser ? 'user' : 'agent'}`;

      const msg = document.createElement("div");
      msg.className = "message";
      msg.setAttribute("data-tag", isUser ? "you" : "agent");
      msg.textContent = text;

      wrap.appendChild(msg);
      win.appendChild(wrap);
      win.scrollTop = win.scrollHeight;
    }

    function renderExchange(q, a) {
      appendMessage(q, true);
      appendMessage(a, false);
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escapeQuotes(str) {
      return (str || "").replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    updateAuthUI();
  </script>
</body>
</html>
